# Build Le Dormeur (win-x64 + win-arm64) on every push/PR.
# Create a public GitHub Release with both executables when a tag v* is pushed.
#
# Release example:
#   1. Bump <Version> in src/LeDormeur/LeDormeur.csproj (optional but recommended)
#   2. git tag v0.0.4
#   3. git push origin v0.0.4
#
# Manual run: Actions → Build & Release → Run workflow

name: Build & Release

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.rid }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            if ($tag -notmatch '^v\d+\.\d+\.\d+') {
              Write-Error "Tag must look like v1.2.3 (got: $tag)"
              exit 1
            }
            $version = $tag.Substring(1)
            "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "is_release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Release build: v$version (${{ matrix.rid }})"
          } else {
            "version=0.0.0-ci" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "is_release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "CI build (no release) — ${{ matrix.rid }}"
          }

      - name: Restore
        run: dotnet restore src/LeDormeur/LeDormeur.csproj -r ${{ matrix.rid }}

      - name: Publish single-file (self-contained)
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          $out = "publish/$rid"
          $args = @(
            "publish", "src/LeDormeur/LeDormeur.csproj",
            "-c", "Release",
            "-r", $rid,
            "--self-contained", "true",
            "--no-restore",
            "-p:PublishSingleFile=true",
            "-p:IncludeNativeLibrariesForSelfExtract=true",
            "-p:EnableCompressionInSingleFile=true",
            "-o", $out
          )
          if ("${{ steps.ver.outputs.is_release }}" -eq "true") {
            $v = "${{ steps.ver.outputs.version }}"
            $args += "-p:Version=$v"
            $args += "-p:AssemblyVersion=$v.0"
            $args += "-p:FileVersion=$v.0"
            $args += "-p:InformationalVersion=$v"
          }
          Write-Host "dotnet $($args -join ' ')"
          & dotnet @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $src = Join-Path $out "LeDormeur.exe"
          if (-not (Test-Path $src)) {
            Write-Error "Expected artifact missing: $src"
            exit 1
          }

          # Distinct names so both can sit in the same release
          $dstName = "LeDormeur-$rid.exe"
          $dst = Join-Path $out $dstName
          Move-Item -Path $src -Destination $dst -Force

          $sizeMb = [math]::Round((Get-Item $dst).Length / 1MB, 2)
          Write-Host "Published: $dst ($sizeMb MB)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeDormeur-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/LeDormeur-${{ matrix.rid }}.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Public GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Resolve version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v1.2.3 (got: $TAG)" >&2
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: LeDormeur-*
          merge-multiple: true

      - name: List release files
        run: ls -lah dist/

      - name: Create public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Le Dormeur v${{ steps.ver.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/LeDormeur-win-x64.exe
            dist/LeDormeur-win-arm64.exe
          body: |
            ## Le Dormeur v${{ steps.ver.outputs.version }}

            Self-contained Windows executables — **no .NET install required**.

            ### Download
            | File | Architecture |
            |------|----------------|
            | **LeDormeur-win-x64.exe** | Intel / AMD 64-bit (most PCs) |
            | **LeDormeur-win-arm64.exe** | Windows on ARM (Snapdragon, Surface ARM, etc.) |

            ### Notes
            - Windows 10/11
            - Settings are stored in `%AppData%\LeDormeur\settings.json`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
